name: Publish Fork Image

# Builds this fork's image to GHCR. Deploying it is a manual redeploy in Coolify.
on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: publish-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_publish:
    name: Build and publish image
    # Upstream already publishes its own images; only run in the fork.
    if: github.repository != 'documenso/documenso'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which GHCR requires.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
